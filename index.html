<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>盈科律所胥斐团队 - 专业法律服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            text-decoration: none;
            font-family: 'Microsoft Yahei', 'PingFang SC', 'Helvetica Neue', Roboto, sans-serif;
        }

        :root {
            --primary-color: #D4AF37;
            --secondary-color: #1F2937;
            --light-color: #F3F4F6;
            --dark-color: #111827;
            --text-color: #E5E7EB;
        }

        body {
            background-color: var(--dark-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s ease;
            text-align: center;
            padding: 0.8rem 0;
        }

        .navbar.scrolled {
            background-color: rgba(17, 24, 39, 1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #D4AF37, #F5E2A0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .main-content {
            padding-top: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .image-custom-container {
            max-width: 45.22cm;
            width: 90%;
            margin: 1rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 5;
        }
        .image-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 32px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            height: 91cm;
            display: flex;
            flex-direction: column;
        }
        .image-card:hover {
            border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 18px 32px rgba(0,0,0,0.5);
        }
        .law-image {
            width: 100%;
            flex: 1;
            display: block;
            object-fit: cover;
            transition: transform 0.3s ease;
            background: #0a0f16;
        }
        .law-image:hover {
            transform: scale(1.01);
        }
        .upload-area {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 0.9rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.4);
        }
        .upload-label {
            background: rgba(212, 175, 55, 0.18);
            border: 1px solid var(--primary-color);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #f5e7b2;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .upload-label:hover {
            background: rgba(212, 175, 55, 0.4);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .upload-input {
            display: none;
        }
        .reset-btn {
            background: rgba(80, 80, 100, 0.7);
            border: none;
            padding: 0.45rem 1.1rem;
            border-radius: 40px;
            color: #f0f0f0;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .reset-btn:hover {
            background: rgba(160, 160, 180, 0.8);
            color: white;
            transform: scale(0.97);
        }
        /* 兼容性提示条 */
        .compat-warning {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 100, 70, 0.95);
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            z-index: 10001;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .image-custom-container {
                padding: 0 1rem;
                width: 95%;
            }
            .upload-area {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .upload-label {
                justify-content: center;
            }
            .compat-warning {
                top: 80px;
                font-size: 0.65rem;
                white-space: normal;
                text-align: center;
                width: 90%;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98);}
            to { opacity: 1; transform: scale(1);}
        }
        .image-custom-container {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">盈科律所 · 胥斐团队</div>
        </div>
    </nav>

    <div class="main-content">
        <div class="image-custom-container">
            <div class="image-card" id="imageCard">
                <img id="lawOfficeImage" class="law-image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4522 9100'%3E%3Crect width='4522' height='9100' fill='%231e2a3a'/%3E%3Ctext x='50%25' y='45%25' font-size='120' fill='%23D4AF37' text-anchor='middle' dominant-baseline='middle' font-family='Arial'%3E🏛️ 盈科律所·胥斐团队%3C/text%3E%3Ctext x='50%25' y='52%25' font-size='70' fill='%23a0b4d0' text-anchor='middle'%3E45.22cm × 91cm%3C/text%3E%3Ctext x='50%25' y='60%25' font-size='60' fill='%23a0b4d0' text-anchor='middle'%3E点击按钮上传实景照片%3C/text%3E%3C/svg%3E"
                     alt="盈科律所胥斐团队形象图">
                <div class="upload-area">
                    <label class="upload-label" for="imageUpload">
                        📤 上传本地图片
                    </label>
                    <input type="file" id="imageUpload" class="upload-input" accept="image/jpeg, image/png, image/jpg, image/webp">
                    <button id="resetImageBtn" class="reset-btn">⟳ 恢复默认</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ========= 360浏览器兼容性增强版：多重存储方案 =========
        const imageUpload = document.getElementById('imageUpload');
        const lawOfficeImg = document.getElementById('lawOfficeImage');
        const resetBtn = document.getElementById('resetImageBtn');
        
        // 默认优雅SVG占位符
        const DEFAULT_IMAGE_SRC = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4522 9100'%3E%3Crect width='4522' height='9100' fill='%231e2a3a'/%3E%3Ctext x='50%25' y='45%25' font-size='120' fill='%23D4AF37' text-anchor='middle' dominant-baseline='middle' font-family='Arial'%3E🏛️ 盈科律所·胥斐团队%3C/text%3E%3Ctext x='50%25' y='52%25' font-size='70' fill='%23a0b4d0' text-anchor='middle'%3E45.22cm × 91cm%3C/text%3E%3Ctext x='50%25' y='60%25' font-size='60' fill='%23a0b4d0' text-anchor='middle'%3E点击按钮上传实景照片%3C/text%3E%3C/svg%3E";

        // 检测是否为360浏览器（通过UA和特有属性）
        function is360Browser() {
            var ua = navigator.userAgent.toLowerCase();
            // 360浏览器的UA特征
            return ua.indexOf('360se') > -1 || ua.indexOf('qihu 360') > -1 || 
                   (ua.indexOf('chrome') > -1 && typeof window.external !== 'undefined' && 
                    (window.external.twGetRunPath && window.external.twGetRunPath().toLowerCase().indexOf('360') > -1));
        }

        // 检测localStorage是否可用且容量正常
        function isLocalStorageAvailable() {
            try {
                var testKey = '__storage_test__';
                localStorage.setItem(testKey, '1');
                localStorage.removeItem(testKey);
                return true;
            } catch(e) {
                return false;
            }
        }

        // 360兼容性提示
        if (is360Browser()) {
            console.log('检测到360浏览器，启用兼容存储模式');
            showToast('360浏览器兼容模式已启用，图片将使用增强存储', '#D4AF37', '#111827', 3000);
        }

        /**
         * 保存图片 - 多重存储策略
         * 1. localStorage（主要）
         * 2. sessionStorage（备用备份）
         * 3. 如果localStorage存储失败（容量问题），自动压缩提示
         */
        function updateAndSaveImage(imageDataUrl) {
            // 更新显示
            lawOfficeImg.src = imageDataUrl;
            
            // 估算Base64数据大小（字符数约等于实际大小的4/3）
            var estimatedSize = (imageDataUrl.length * 3) / 4;
            var sizeMB = (estimatedSize / (1024 * 1024)).toFixed(2);
            
            // 尝试保存到localStorage
            try {
                localStorage.setItem('lawOfficeCustomImage', imageDataUrl);
                // 同时备份到sessionStorage（同标签页内有效）
                sessionStorage.setItem('lawOfficeCustomImage_backup', imageDataUrl);
                console.log('图片已保存，大小约 ' + sizeMB + ' MB');
            } catch (e) {
                // 存储失败（通常是超出容量限制）
                console.error('localStorage存储失败:', e);
                if (e.name === 'QuotaExceededError') {
                    showToast('⚠️ 图片过大(' + sizeMB + 'MB)，建议压缩后重新上传', '#ff6600', '#ffffff', 4000);
                } else {
                    showToast('存储失败，请尝试更小的图片', '#ff4444', '#ffffff', 3000);
                }
                return false;
            }
            return true;
        }

        /**
         * 加载图片 - 优先从localStorage读取，失败则尝试sessionStorage备份
         */
        function loadSavedImage() {
            var savedImage = null;
            var useBackup = false;
            
            // 首先尝试从localStorage读取
            try {
                savedImage = localStorage.getItem('lawOfficeCustomImage');
                if (savedImage && savedImage !== DEFAULT_IMAGE_SRC && savedImage.startsWith('data:image')) {
                    // 验证图片数据是否完整（简单检查）
                    if (savedImage.length > 100) {
                        lawOfficeImg.src = savedImage;
                        console.log('从localStorage加载图片成功');
                        return;
                    } else {
                        console.log('localStorage数据异常，长度过短');
                    }
                }
            } catch(e) {
                console.log('读取localStorage失败:', e);
            }
            
            // 备用：从sessionStorage读取
            try {
                var backupImage = sessionStorage.getItem('lawOfficeCustomImage_backup');
                if (backupImage && backupImage !== DEFAULT_IMAGE_SRC && backupImage.startsWith('data:image') && backupImage.length > 100) {
                    lawOfficeImg.src = backupImage;
                    // 修复：将备份恢复到localStorage
                    localStorage.setItem('lawOfficeCustomImage', backupImage);
                    console.log('从sessionStorage备份恢复图片成功');
                    showToast('图片已从备份恢复', '#D4AF37', '#111827', 2000);
                    return;
                }
            } catch(e) {
                console.log('读取sessionStorage备份失败:', e);
            }
            
            // 无有效图片，加载默认图
            lawOfficeImg.src = DEFAULT_IMAGE_SRC;
            try {
                if (localStorage.getItem('lawOfficeCustomImage') !== DEFAULT_IMAGE_SRC) {
                    localStorage.setItem('lawOfficeCustomImage', DEFAULT_IMAGE_SRC);
                }
            } catch(e) {}
            console.log('加载默认图片');
        }

        // 页面加载时执行
        loadSavedImage();

        // 上传本地图片
        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 校验文件类型
            if (!file.type.match('image.*')) {
                alert('请选择图片格式文件 (JPEG, PNG, WEBP)');
                imageUpload.value = '';
                return;
            }
            
            // 360浏览器建议更严格的尺寸限制
            const maxSize = is360Browser() ? 8 * 1024 * 1024 : 12 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('图片大小请控制在' + (maxSize/(1024*1024)) + 'MB以内（360浏览器建议更小图片以确保存储稳定）');
                imageUpload.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                var success = updateAndSaveImage(imgData);
                if (success) {
                    imageUpload.value = '';
                    showToast('✅ 图片已更新并自动保存', '#D4AF37', '#111827');
                }
            };
            reader.onerror = function() {
                alert('读取图片失败，请重试');
                imageUpload.value = '';
            };
            reader.readAsDataURL(file);
        });

        // 恢复默认按钮
        resetBtn.addEventListener('click', function() {
            updateAndSaveImage(DEFAULT_IMAGE_SRC);
            imageUpload.value = '';
            showToast('⟳ 已恢复默认形象图', 'rgba(100,100,120,0.85)', '#ffffff');
        });

        // 拖拽上传支持
        const imageCard = document.getElementById('imageCard');
        
        imageCard.addEventListener('dragover', (e) => {
            e.preventDefault();
            imageCard.style.borderColor = '#D4AF37';
            imageCard.style.boxShadow = '0 0 0 2px rgba(212,175,55,0.4)';
        });
        
        imageCard.addEventListener('dragleave', () => {
            imageCard.style.borderColor = 'rgba(212, 175, 55, 0.5)';
            imageCard.style.boxShadow = 'none';
        });
        
        imageCard.addEventListener('drop', (e) => {
            e.preventDefault();
            imageCard.style.borderColor = 'rgba(212, 175, 55, 0.5)';
            imageCard.style.boxShadow = 'none';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.match('image.*')) {
                const maxSize = is360Browser() ? 8 * 1024 * 1024 : 12 * 1024 * 1024;
                if (file.size > maxSize) {
                    alert('图片不能超过' + (maxSize/(1024*1024)) + 'MB');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    updateAndSaveImage(ev.target.result);
                    imageUpload.value = '';
                    showToast('📸 图片已通过拖拽更新并保存', '#D4AF37', '#111827');
                };
                reader.onerror = () => alert('读取拖拽图片失败');
                reader.readAsDataURL(file);
            } else {
                alert('请拖拽有效的图片文件（JPG、PNG、WEBP）');
            }
        });

        /**
         * 统一的提示框函数
         */
        function showToast(message, bgColor, textColor, duration = 2000) {
            // 移除已存在的toast
            const existingToast = document.querySelector('.custom-toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.innerText = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = bgColor;
            toast.style.color = textColor;
            toast.style.padding = '8px 20px';
            toast.style.borderRadius = '40px';
            toast.style.fontSize = '0.85rem';
            toast.style.fontWeight = '500';
            toast.style.zIndex = '10000';
            toast.style.backdropFilter = 'blur(4px)';
            toast.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
            toast.style.whiteSpace = 'nowrap';
            toast.style.fontFamily = 'inherit';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        // 页面关闭前额外备份（针对360浏览器）
        window.addEventListener('beforeunload', function() {
            try {
                var currentImage = lawOfficeImg.src;
                if (currentImage && currentImage !== DEFAULT_IMAGE_SRC && currentImage.startsWith('data:image')) {
                    sessionStorage.setItem('lawOfficeCustomImage_backup', currentImage);
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
